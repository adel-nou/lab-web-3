<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iOS Calculator - Lab 3</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #121212;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .calculator {
            background-color: #000;
            padding: 20px;
            border-radius: 30px;
            width: 320px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .title {
            text-align: center;
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #fff;
        }

        .display {
            background-color: #1c1c1e;
            color: #fff;
            font-size: 48px;
            text-align: right;
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow-x: auto;
            word-wrap: break-word;
            white-space: nowrap;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .btn {
            height: 62px;
            border-radius: 50px;
            border: none;
            font-size: 24px;
            font-weight: 500;
            cursor: pointer;
            transition: filter 0.15s ease;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .btn:active {
            filter: brightness(130%);
        }

        .btn-top {
            background-color: #a5a5a5;
            color: #000;
        }

        .btn-num {
            background-color: #333333;
            color: #fff;
        }

        .btn-operator {
            background-color: #ff9f0a;
            color: #fff;
        }

        .btn-zero {
            grid-column: span 2;
            border-radius: 35px;
            justify-content: flex-start;
            padding-left: 25px;
        }
    </style>
</head>
<body>
<div class="calculator">
    <h1 class="title">iOS Calculator</h1>
    <div class="display" id="display">0</div>
    <div class="buttons" id="buttons">
        <button class="btn btn-top" data-action="clear">AC</button>
        <button class="btn btn-top" data-action="double-zero">00</button>
        <button class="btn btn-top" data-action="percent">%</button>
        <button class="btn btn-operator" data-action="operator" data-op="/">÷</button>

        <button class="btn btn-num" data-action="number">7</button>
        <button class="btn btn-num" data-action="number">8</button>
        <button class="btn btn-num" data-action="number">9</button>
        <button class="btn btn-operator" data-action="operator" data-op="*">×</button>

        <button class="btn btn-num" data-action="number">4</button>
        <button class="btn btn-num" data-action="number">5</button>
        <button class="btn btn-num" data-action="number">6</button>
        <button class="btn btn-operator" data-action="operator" data-op="-">-</button>

        <button class="btn btn-num" data-action="number">1</button>
        <button class="btn btn-num" data-action="number">2</button>
        <button class="btn btn-num" data-action="number">3</button>
        <button class="btn btn-operator" data-action="operator" data-op="+">+</button>

        <button class="btn btn-num btn-zero" data-action="number">0</button>
        <button class="btn btn-num" data-action="decimal">.</button>
        <button class="btn btn-operator" data-action="calculate">=</button>
    </div>
</div>

<script>
    let currentInput = '0';
    let previousInput = '';
    let operator = null;
    let shouldResetDisplay = false;

    const display = document.getElementById('display');
    const buttons = document.getElementById('buttons');

    function updateDisplay() {
        display.textContent = currentInput;
    }

    function appendNumber(number) {
        if (currentInput === '0' || shouldResetDisplay) {
            currentInput = number;
            shouldResetDisplay = false;
        } else {
            currentInput += number;
        }
    }

    function appendDecimal() {
        if (shouldResetDisplay) {
            currentInput = '0.';
            shouldResetDisplay = false;
            return;
        }
        if (!currentInput.includes('.')) {
            currentInput += '.';
        }
    }

    function handleOperator(nextOperator) {
        if (operator && !shouldResetDisplay) {
            calculate();
        }
        previousInput = currentInput;
        operator = nextOperator;
        shouldResetDisplay = true;
    }

    function calculate() {
        if (!operator || shouldResetDisplay) return;

        const prev = parseFloat(previousInput);
        const curr = parseFloat(currentInput);

        if (isNaN(prev) || isNaN(curr)) return;

        let result = 0;
        switch (operator) {
            case '+':
                result = prev + curr;
                break;
            case '-':
                result = prev - curr;
                break;
            case '*':
                result = prev * curr;
                break;
            case '/':
                result = curr === 0 ? 'Error' : prev / curr;
                break;
            default:
                return;
        }

        currentInput = result.toString();
        operator = null;
        previousInput = '';
        shouldResetDisplay = true;
    }

    function clearAll() {
        currentInput = '0';
        previousInput = '';
        operator = null;
        shouldResetDisplay = false;
    }

    function handlePercent() {
        const val = parseFloat(currentInput);
        if (!isNaN(val)) {
            currentInput = (val / 100).toString();
        }
    }

    function handleDoubleZero() {
        if (currentInput !== '0' && !shouldResetDisplay) {
            currentInput += '00';
        }
    }

    buttons.addEventListener('click', (e) => {
        const target = e.target;
        if (!target.classList.contains('btn')) return;

        const action = target.dataset.action;
        const text = target.textContent;

        if (action === 'number') {
            appendNumber(text);
        } else if (action === 'decimal') {
            appendDecimal();
        } else if (action === 'operator') {
            handleOperator(target.dataset.op);
        } else if (action === 'calculate') {
            calculate();
        } else if (action === 'clear') {
            clearAll();
        } else if (action === 'percent') {
            handlePercent();
        } else if (action === 'double-zero') {
            handleDoubleZero();
        }

        updateDisplay();
    });
</script>
</body>
</html>
